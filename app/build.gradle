plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.colodin.mvicompose'
    compileSdk 36

    defaultConfig {
        applicationId "com.colodin.mvicompose"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "com.colodin.mvicompose.MyTestRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.2'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    flavorDimensions += "environment"
    productFlavors {
        dev {
            dimension "environment"
            ext {
                PARSE_URL = "http://10.0.2.2:1337/parse"
                PARSE_APPLICATION_ID = "DlsRT6GgzYWQHBAFf3hzYZpcTnX7CaZ2TevT0K3N"
            }
        }

        applicationVariants.all { variant ->
            def dimensions = variant.productFlavors
            def environment = dimensions[0]

            def parseUrl = environment.ext.PARSE_URL
            def parseApplicationId = environment.ext.PARSE_APPLICATION_ID
            variant.buildConfigField "String", "PARSE_URL", "\"$parseUrl\""
            variant.buildConfigField "String", "PARSE_APPLICATION_ID", "\"$parseApplicationId\""
        }
    }
}

dependencies {

    implementation "androidx.navigation:navigation-compose:2.9.3"

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    
    implementation platform("androidx.compose:compose-bom:2025.08.01")

    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.ui:ui-tooling-preview"

    implementation 'androidx.compose.runtime:runtime-livedata:1.9.0'

    // Parse
    implementation 'com.github.parse-community.Parse-SDK-Android:parse:4.3.0'
    implementation 'com.github.parse-community.Parse-SDK-Android:ktx:4.3.0'
    implementation 'com.github.parse-community.Parse-SDK-Android:coroutines:4.3.0'
    // Koin
    implementation 'io.insert-koin:koin-androidx-compose:4.1.0'

    // Timber
    implementation 'com.jakewharton.timber:timber:5.0.1'


    implementation "io.coil-kt:coil-compose:2.7.0"


    // Unit Tests
    testImplementation "junit:junit:4.13.2"
    testImplementation "io.insert-koin:koin-test:4.1.0"
    testImplementation "io.insert-koin:koin-test-junit4:4.1.0"

    // Instrumented Tests
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"

    // Compose testing dependencies
    androidTestImplementation "androidx.compose.ui:ui-test:$compose_version"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"

    //Espresso
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'

}